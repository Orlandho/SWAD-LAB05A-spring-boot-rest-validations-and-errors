spring.application.name=laboratorio05a-test

# Configuración de base de datos H2 en memoria para pruebas automáticas continuas (CI/CD)
spring.datasource.url=jdbc:h2:mem:testdb_lab05a;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
